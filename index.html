<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>श्री विश्वकर्मा पूजन 2026 | Reliance</title>
    <style>
        :root {
            --primary: #c94a29;
            --reliance-blue: #0b3c68;
            --bg: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #222222;
            --text-muted: #666666;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.5;
            padding: 15px 10px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            border: 1px solid var(--border);
        }

        /* Header */
        .header {
            text-align: center;
            padding: 30px 15px 20px;
            background: linear-gradient(180deg, #fff4ee 0%, #ffffff 100%);
            border-bottom: 1px solid var(--border);
        }

        .logo-wrap {
            display: inline-block;
            margin-bottom: 18px;
        }

        /* Bada aur Saaf Logo */
        .reliance-logo {
            height: 75px;
            max-width: 220px;
            width: auto;
            object-fit: contain;
            display: block;
            margin: 0 auto;
        }

        .avatar-wrap {
            width: 130px;
            height: 130px;
            margin: 0 auto 12px;
        }

        .avatar-wrap img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--primary);
            box-shadow: 0 4px 14px rgba(201, 74, 41, 0.25);
        }

        .title {
            color: var(--primary);
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .time-box {
            display: inline-flex;
            flex-direction: column;
            gap: 4px;
            background: #ffffff;
            border: 1px solid #f2cfc2;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 0.9rem;
        }

        /* Content */
        .content {
            padding: 20px 15px;
        }

        .section {
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--reliance-blue);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title::before {
            content: "";
            width: 4px;
            height: 16px;
            background: var(--primary);
            border-radius: 2px;
        }

        /* 38 Members Grid */
        .team-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 10px;
        }

        .team-card {
            background: #fafafa;
            border: 1px solid var(--border);
            padding: 10px 8px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .member-photo {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary);
            background-color: #eaeaea;
            margin-bottom: 6px;
        }

        .member-info .name {
            display: block;
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 140px;
        }

        .member-info .role {
            font-size: 0.72rem;
            color: var(--primary);
            background: #fdf0eb;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
            display: inline-block;
            margin-top: 3px;
        }

        /* Planning Section */
        .planning-folder {
            background: #fdfdfd;
            border: 1px dashed #d0d7de;
            border-radius: 12px;
            padding: 15px;
        }

        .plan-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .plan-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .plan-icon {
            font-size: 1.1rem;
            margin-top: 2px;
        }

        .plan-details strong {
            display: block;
            font-size: 0.9rem;
            color: #333;
        }

        .plan-details span {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .sheet-btn {
            display: block;
            text-align: center;
            background: var(--reliance-blue);
            color: #ffffff;
            text-decoration: none;
            padding: 11px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.88rem;
            margin-top: 14px;
        }

        .sheet-btn:hover {
            opacity: 0.9;
        }

        /* Footer */
        .footer {
            background: #f8f9fa;
            border-top: 1px solid var(--border);
            padding: 20px 15px;
            text-align: center;
        }

        .closing-msg {
            color: var(--primary);
            font-weight: 700;
            font-size: 0.95rem;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="container">
    
    <header class="header">
        <div class="logo-wrap">
            <img src="reliance-logo.png" alt="Reliance Logo" class="reliance-logo">
        </div>
